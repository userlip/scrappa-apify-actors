        uses: actions/checkout@v6

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Run Rust actor tests
        working-directory: ${{ matrix.actor }}
        run: cargo test --locked

  check-generated-actors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check generated Actor files
        run: node scripts/generate-actors.mjs --check

      - name: Validate generated Store copy
        run: node scripts/validate-store-copy.mjs

      - name: Validate prefilled inputs against input schemas
        run: node scripts/validate-prefill.mjs actors/*

      - name: Validate input schemas with Apify's validator
        run: |
          npm install --no-save --no-package-lock @apify/input_schema@4.0.5 ajv@8.20.0
          node scripts/validate-input-schemas.mjs
