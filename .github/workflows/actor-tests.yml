          - actors/google-maps-directions-scraper
          - actors/google-maps-photos-scraper
          - actors/google-maps-reviews-scraper
          - actors/google-maps-search-scraper
          - actors/google-news-scraper
          - actors/google-patents-details-scraper
          - actors/google-patents-search-scraper
          - actors/google-search
          - actors/google-translate-scraper
          - actors/google-trends-autocomplete-scraper
          - actors/google-trends-interest-scraper
          - actors/google-trends-related-queries-scraper
          - actors/google-videos-scraper
