name: Actor Tests

on:
  push:
    branches:
      - main
    paths:
      - 'actors/**'
      - '.github/workflows/actor-tests.yml'
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'actors/**'
      - '.github/workflows/actor-tests.yml'

concurrency:
  group: actor-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  test-rust-actors:
    runs-on: [self-hosted, ci, github-actions]
    strategy:
      fail-fast: false
      matrix:
        actor:
          - actors/arbeitsagentur-jobs-scraper
          - actors/booking-hotel-details-scraper
          - actors/booking-search-scraper
