name: Actor Tests

on:
  push:
    branches:
      - main
    paths:
      - 'actors/**'
      - '.github/workflows/actor-tests.yml'
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'actors/**'
      - '.github/workflows/actor-tests.yml'

concurrency:
  group: actor-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-actors:
    runs-on: [self-hosted, ci, github-actions]
    strategy:
      fail-fast: false
      matrix:
        actor:
          - path: actors/google-images-scraper
          - path: actors/google-flights-search-scraper
          - path: actors/google-hotels-search-scraper
          - path: actors/google-jobs-scraper
          - path: actors/google-maps-business-details-scraper
          - path: actors/immobilienscout24-locations-scraper
          - path: actors/immobilienscout24-price-insights-scraper
          - path: actors/instagram-post-info-cheapest-0-20-1000-results
          - path: actors/instagram-user-info-cheapest-0-20-1000-results
          - path: actors/instagram-user-posts-cheapest-0-20-1000-results
          - path: actors/linkedin-search-scraper
          - path: actors/redfin-property-details-scraper
          - path: actors/tiktok-comments-scraper
          - path: actors/tiktok-profile-scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.actor.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.actor.path }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.actor.path }}
        run: npm test

  test-rust-actors:
    runs-on: [self-hosted, ci, github-actions]
    strategy:
      fail-fast: false
      matrix:
        actor:
          - actors/kleinanzeigen-listing-details-scraper
          - actors/youtube-api-batch-videos
          - actors/linkedin-company-scraper
          - actors/linkedin-profile-scraper
          - actors/trustpilot-company-reviews-scraper
          - actors/youtube-api-video-comments
          - actors/youtube-api-related-videos
          - actors/youtube-api-search-data
          - actors/youtube-api-search-suggestions
          - actors/youtube-api-get-video-details
          - actors/youtube-api-channel-videos
          - actors/youtube-transcript-scraper
          - actors/youtube-api-trending-videos
          - actors/youtube-api-video-chapters
          - actors/youtube-api-search-by-category
          - actors/youtube-api-hashtags
          - actors/youtube-api-playlists
          - actors/youtube-api-get-channel-shorts
          - actors/youtube-api-get-channel-statistics
          - actors/youtube-api-get-playlists-details
          - actors/youtube-api-get-channel-community
          - actors/youtube-api-get-channel-details
          - actors/youtube-api-get-channel-livestreams
          - actors/youtube-api-get-channel-playlists
          - actors/youtube-api-get-channel-about-details
          - actors/youtube-api-channel-podcasts
          - actors/google-news-scraper
          - actors/tiktok-search-scraper
          - actors/linkedin-post-scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Run Rust actor tests
        working-directory: ${{ matrix.actor }}
        run: cargo test --locked
