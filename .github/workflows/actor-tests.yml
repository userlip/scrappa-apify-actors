name: Actor Tests

on:
  push:
    branches:
      - main
    paths:
      - 'actors/**'
      - 'specs/**'
      - 'templates/**'
      - 'scripts/generate-actors.mjs'
      - 'scripts/validate-store-copy.mjs'
      - 'scripts/validate-prefill.mjs'
      - 'scripts/validate-input-schemas.mjs'
      - 'docs/generated-actors.md'
      - 'README.md'
      - '.github/workflows/actor-tests.yml'
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'actors/**'
      - 'specs/**'
      - 'templates/**'
      - 'scripts/generate-actors.mjs'
      - 'scripts/validate-store-copy.mjs'
      - 'scripts/validate-prefill.mjs'
      - 'scripts/validate-input-schemas.mjs'
      - 'docs/generated-actors.md'
      - 'README.md'
      - '.github/workflows/actor-tests.yml'

concurrency:
  group: actor-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  test-rust-actors:
    runs-on: [self-hosted, ci, github-actions]
    strategy:
