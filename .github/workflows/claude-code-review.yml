          plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW CONTEXT DIR: ${{ steps.review-context.outputs.path }}

            The first Claude Code Review attempt failed, likely due to a transient AI backend or network issue. Resume the interrupted review session and continue from the existing context.

            ${{ env.CLAUDE_SKILL_REMINDER }}

            ${{ env.REVIEW_PROMPT }}

      - name: Validate Claude Code Review retry result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && steps.ai-config.outputs.token_type == 'CLAUDE_CODE_OAUTH_TOKEN' && steps.claude-review-result.outcome == 'failure' && steps.claude-review.outputs.session_id != '' }}
        id: claude-review-retry-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-retry.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-retry.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code retry concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code retry did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false) and (.[-1].result | startswith("REVIEW_STATUS: complete"))' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code retry returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
