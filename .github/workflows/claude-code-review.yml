          session_id="$(jq -r '[.[] | select(.type == "system" and .subtype == "init") | .session_id // empty][0] // ""' "$execution_file")"
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"

          if [[ "$status" -eq 0 ]] && jq -e '.[-1].type == "result" and .[-1].subtype == "success" and ((.[-1].is_error // false) == false)' "$execution_file" >/dev/null; then
