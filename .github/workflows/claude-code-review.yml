          } > "$body_file"
          jq -n --rawfile body "$body_file" '{ body: $body }' \
            | curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @- >/dev/null
          exit 1

      - name: Validate Claude Code Review custom backend retry result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && (steps.ai-config.outputs.token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.token_type == 'ANTHROPIC_AUTH_TOKEN') && steps.claude-review-custom-result.outcome == 'failure' && steps.claude-review-custom.outputs.session_id != '' }}
        id: claude-review-custom-retry-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-custom-retry.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-custom-retry.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code custom backend retry concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code custom backend retry did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false)' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code custom backend retry returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
          exit 1

      - name: Post Claude Code Review custom backend retry result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && (steps.ai-config.outputs.token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.token_type == 'ANTHROPIC_AUTH_TOKEN') && steps.claude-review-custom-retry-result.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review-custom-retry.outputs.execution_file }}
        run: |
          set -euo pipefail

          result="$(jq -er '.[-1].result | select(type == "string" and length > 0)' "$EXECUTION_FILE")"
          body_file="$(mktemp)"
          {
            echo "**Claude finished @${{ github.actor }}'s task** —— [View job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "---"
            echo "$result"
          } > "$body_file"

          jq -n --rawfile body "$body_file" '{ body: $body }' \
            | curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @- >/dev/null

      - name: Prepare Claude Code Review backup
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && ((steps.ai-config.outputs.token_type == 'CODEX_AUTH_JSON' && steps.codex-review.outcome == 'failure') || (steps.ai-config.outputs.token_type == 'CLAUDE_CODE_OAUTH_TOKEN' && steps.claude-review-result.outcome == 'failure' && (steps.claude-review.outputs.session_id == '' || steps.claude-review-retry-result.outcome == 'failure')) || ((steps.ai-config.outputs.token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.token_type == 'ANTHROPIC_AUTH_TOKEN') && steps.claude-review-custom-result.outcome == 'failure' && (steps.claude-review-custom.outputs.session_id == '' || steps.claude-review-custom-retry-result.outcome == 'failure'))) }}
        id: claude-review-backup
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ steps.ai-config.outputs.backup_token }}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          session_id="${{ steps.claude-review.outputs.session_id }}"
          if [[ -z "$session_id" ]]; then
            session_id="${{ steps.claude-review-custom.outputs.session_id }}"
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$session_id" ]]; then
            echo "resume_args=--resume ${session_id}" >> "$GITHUB_OUTPUT"
          else
            echo "resume_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex Review with backup
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' }}
        id: codex-review-backup
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ steps.ai-config.outputs.backup_token }}
          CODEX_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          CODEX_EFFORT: ${{ steps.ai-config.outputs.backup_effort_level }}
          REVIEW_PROMPT: ${{ env.BACKUP_REVIEW_PROMPT }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v codex >/dev/null 2>&1; then
            echo "::error::Codex CLI is not installed in this runner image."
            exit 1
          fi

          export CODEX_HOME="${RUNNER_TEMP}/codex-backup"
          install -d -m 0700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 0600 "$CODEX_HOME/auth.json"

          prompt_file="${RUNNER_TEMP}/codex-review-backup-prompt.txt"
          result_file="${RUNNER_TEMP}/codex-review-backup-result.md"
          events_file="${RUNNER_TEMP}/codex-review-backup-events.jsonl"
          error_file="${RUNNER_TEMP}/codex-review-backup-error.log"
          {
            printf 'REPO: %s\n' "${{ github.repository }}"
            printf 'PR NUMBER: %s\n\n' "${{ github.event.pull_request.number }}"
            printf 'The primary review backend failed. Continue the automated review with this backup Codex account.\n\n'
            printf '%s\n' "$REVIEW_PROMPT"
          } > "$prompt_file"

          codex_args=(exec --ephemeral --ignore-user-config --ignore-rules --sandbox read-only -c 'approval_policy="never"' --json -o "$result_file")
          [[ -n "$CODEX_MODEL" ]] && codex_args+=(-m "$CODEX_MODEL")
          [[ -n "$CODEX_EFFORT" ]] && codex_args+=(-c "model_reasoning_effort=\"${CODEX_EFFORT}\"")

          if [[ "${{ github.event.pull_request.head.repo.id }}" == "${{ github.event.pull_request.base.repo.id }}" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            codex_args+=(review --base "${{ github.event.pull_request.base.sha }}" -)
          else
            context_dir="${RUNNER_TEMP}/codex-review-context"
            if [[ ! -s "$context_dir/pr.diff" ]]; then
              install -d -m 0700 "$context_dir"
              gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json title,body,author,baseRefName,headRefName,files > "$context_dir/pr.json"
              gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > "$context_dir/pr.diff"
              gh pr checks "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > "$context_dir/checks.txt" || true
            fi
            printf '\nReview the fork PR metadata, diff, and checks in %s. Do not execute code from the diff.\n' "$context_dir" >> "$prompt_file"
            codex_args+=(-)
          fi

          if ! timeout 900 codex "${codex_args[@]}" < "$prompt_file" > "$events_file" 2> "$error_file"; then
            echo "::error::Backup Codex review failed."
            tail -c 4000 "$error_file" || true
            exit 1
          fi

          if [[ ! -s "$result_file" ]] || ! jq -e 'select(.type == "turn.completed")' "$events_file" >/dev/null; then
            echo "::error::Backup Codex did not produce a completed review result."
            exit 1
          fi

          head -c 60000 "$result_file" > "${result_file}.comment"
          jq -Rs '{body: ("**Codex backup finished the automated review** — [View job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n" + .)}' "${result_file}.comment" | curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @- >/dev/null

      - name: Run Claude Code Review with backup
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' }}
        id: claude-review-backup-oauth
        continue-on-error: true
        uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai-config.outputs.backup_base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.ai-config.outputs.backup_token }}
          ANTHROPIC_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai-config.outputs.backup_default_opus_model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai-config.outputs.backup_default_sonnet_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai-config.outputs.backup_default_haiku_model }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.ai-config.outputs.backup_subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.ai-config.outputs.backup_effort_level }}
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ steps.ai-config.outputs.backup_token }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ steps.ai-config.outputs.backup_base_url }}",
                "ANTHROPIC_MODEL": "${{ steps.ai-config.outputs.backup_model }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ steps.ai-config.outputs.backup_default_opus_model }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ steps.ai-config.outputs.backup_default_sonnet_model }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ steps.ai-config.outputs.backup_default_haiku_model }}",
                "CLAUDE_CODE_SUBAGENT_MODEL": "${{ steps.ai-config.outputs.backup_subagent_model }}"
              }
            }
          claude_args: ${{ steps.ai-config.outputs.backup_claude_args }} ${{ steps.laravel-boost.outputs.claude_args }} ${{ steps.claude-review-backup.outputs.resume_args }}
          plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The primary Claude Code Review backend and resume retry failed. Continue the review using the configured backup AI backend.

            ${{ env.BACKUP_REVIEW_PROMPT }}

      - name: Validate Claude Code Review backup result
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' }}
        id: claude-review-backup-oauth-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-backup-oauth.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-backup-oauth.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code backup concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code backup did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false)' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code backup returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
          exit 1

      - name: Run Claude Code Review with backup custom backend
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && (steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') }}
        id: claude-review-backup-custom
        continue-on-error: true
        uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai-config.outputs.backup_base_url }}
          ANTHROPIC_API_KEY: ${{ steps.ai-config.outputs.backup_token }}
          ANTHROPIC_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai-config.outputs.backup_default_opus_model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai-config.outputs.backup_default_sonnet_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai-config.outputs.backup_default_haiku_model }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.ai-config.outputs.backup_subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.ai-config.outputs.backup_effort_level }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ steps.ai-config.outputs.backup_token }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ steps.ai-config.outputs.backup_base_url }}",
                "ANTHROPIC_MODEL": "${{ steps.ai-config.outputs.backup_model }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ steps.ai-config.outputs.backup_default_opus_model }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ steps.ai-config.outputs.backup_default_sonnet_model }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ steps.ai-config.outputs.backup_default_haiku_model }}",
                "CLAUDE_CODE_SUBAGENT_MODEL": "${{ steps.ai-config.outputs.backup_subagent_model }}"
              }
            }
          claude_args: ${{ steps.ai-config.outputs.backup_claude_args }} ${{ steps.laravel-boost.outputs.claude_args }} ${{ steps.claude-review-backup.outputs.resume_args }}
          plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The primary Claude Code Review backend and resume retry failed. Continue the review using the configured backup AI backend.

            ${{ env.BACKUP_REVIEW_PROMPT }}

      - name: Validate Claude Code Review backup custom backend result
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && (steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') }}
        id: claude-review-backup-custom-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-backup-custom.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-backup-custom.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code backup custom backend concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code backup custom backend did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false)' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code backup custom backend returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
          exit 1

      - name: Persist refreshed Codex authentication and release accounts
        if: ${{ always() && steps.ai-config.outcome == 'success' && (steps.ai-config.outputs.codex_account_uuid != '' || steps.ai-config.outputs.backup_codex_account_uuid != '') }}
        continue-on-error: true
        env:
          RUNNER_MANAGER_URL: "https://ci.marin.sh"
          PRIMARY_ACCOUNT_UUID: ${{ steps.ai-config.outputs.codex_account_uuid }}
          PRIMARY_LEASE_TOKEN: ${{ steps.ai-config.outputs.codex_lease_token }}
          PRIMARY_AUTH_JSON: ${{ steps.ai-config.outputs.token_type == 'CODEX_AUTH_JSON' && steps.ai-config.outputs.token || '' }}
          BACKUP_ACCOUNT_UUID: ${{ steps.ai-config.outputs.backup_codex_account_uuid }}
          BACKUP_LEASE_TOKEN: ${{ steps.ai-config.outputs.backup_codex_lease_token }}
          BACKUP_AUTH_JSON: ${{ steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' && steps.ai-config.outputs.backup_token || '' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_MANAGER_URL:?RUNNER_MANAGER_URL is required}"

          oidc_response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RUNNER_MANAGER_URL%/}")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$oidc_response")"

          complete_codex_lease() {
            local account_uuid="$1"
            local lease_token="$2"
            local original_auth="$3"
            local home_path="$4"

            [[ -z "$account_uuid" || -z "$lease_token" ]] && return 0
            local auth_json="$original_auth"
            [[ -s "$home_path/auth.json" ]] && auth_json="$(cat "$home_path/auth.json")"
            jq -n --arg lease_token "$lease_token" --arg auth_json "$auth_json" '{lease_token: $lease_token, auth_json: $auth_json}' > "${RUNNER_TEMP}/codex-lease-${account_uuid}.json"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "@${RUNNER_TEMP}/codex-lease-${account_uuid}.json" \
              "${RUNNER_MANAGER_URL%/}/api/broker/codex/accounts/${account_uuid}/complete" >/dev/null
          }

          completion_failed=0
          complete_codex_lease "$PRIMARY_ACCOUNT_UUID" "$PRIMARY_LEASE_TOKEN" "$PRIMARY_AUTH_JSON" "${RUNNER_TEMP}/codex-primary" || completion_failed=1
          complete_codex_lease "$BACKUP_ACCOUNT_UUID" "$BACKUP_LEASE_TOKEN" "$BACKUP_AUTH_JSON" "${RUNNER_TEMP}/codex-backup" || completion_failed=1
          exit "$completion_failed"

      - name: Warn when AI review is unavailable
        if: ${{ steps.ensure-jq.outcome == 'failure' || steps.review-workflow.outcome == 'failure' || steps.ai-config.outcome == 'failure' || steps.claude-review-backup.outputs.available == 'false' || (steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' && steps.codex-review-backup.outcome == 'failure') || (steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' && steps.claude-review-backup-oauth-result.outcome == 'failure') || ((steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') && steps.claude-review-backup-custom-result.outcome == 'failure') }}
        shell: bash
        run: |
          echo "::error::AI review is currently unavailable because a required workflow prerequisite, AI service, or authentication configuration is unavailable."
          {
            echo "## AI review unavailable"
            echo
            echo "The configured AI review failed because jq, workflow-change detection, the AI service, broker, or authentication configuration is currently unavailable to this repository."
            echo "Please restore the missing workflow prerequisite or AI backend access before relying on this workflow for automated review."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
