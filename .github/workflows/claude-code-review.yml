            echo "**Claude Code Review custom backend failed** —— [View job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "Exit status: $status"
            echo "Backend: ${AI_TOKEN_TYPE}, model: ${ANTHROPIC_MODEL:-default}, base URL: ${ANTHROPIC_BASE_URL:-default}"
