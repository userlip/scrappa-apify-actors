              echo "stdout:"
              echo '```text'
              tail -c 4000 "$output_jsonl"
              echo
              echo '```'
            fi
          } > "$body_file"
          jq -n --rawfile body "$body_file" '{ body: $body }' \
            | curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @- >/dev/null
          exit 1

      - name: Validate Claude Code Review custom backend result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && (steps.ai-config.outputs.token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.token_type == 'ANTHROPIC_AUTH_TOKEN') }}
