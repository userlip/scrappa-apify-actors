            echo "::warning::Ignoring malformed backup Claude Code skills configuration."
            exit 0
          fi

          while IFS= read -r encoded_skill; do
            skill_json="$(printf '%s' "$encoded_skill" | base64 --decode)"
            if ! skill_name="$(jq -er '.name | select(test("^[a-z0-9][a-z0-9-]{0,63}$"))' <<< "$skill_json")" \
              || ! skill_description="$(jq -er '.description | select(type == "string" and length > 0)' <<< "$skill_json")" \
              || ! skill_instructions="$(jq -er '.instructions | select(type == "string" and length > 0)' <<< "$skill_json")"; then
              echo "::warning::Skipping malformed backup Claude Code skill."
              continue
            fi

            skill_directory="${skills_directory}/${skill_name}"
            printf -v skill_mention '$%s' "$skill_name"
            [[ -z "$configured_skill_mentions" ]] || configured_skill_mentions+=', '
            configured_skill_mentions+="$skill_mention"
            if [[ -f "$skill_directory/SKILL.md" ]]; then
              echo "::notice::Keeping the existing Claude Code skill named ${skill_name}."
              continue
            fi

            install -d -m 0700 "$skill_directory"
            {
              echo '---'
              printf 'name: %s\n' "$skill_name"
              printf 'description: %s\n' "$(jq -rn --arg value "$skill_description" '$value | @json')"
              echo '---'
              echo
              printf '%s\n' "$skill_instructions"
            } > "$skill_directory/SKILL.md"
            chmod 0600 "$skill_directory/SKILL.md"
            printf '%s\n' "$skill_name" >> "$backup_skill_manifest"
          done < <(jq -r '.[] | @base64' <<< "$skills_json")

          if [[ -n "$configured_skill_mentions" ]]; then
            echo "BACKUP_CLAUDE_SKILL_REMINDER=Use these configured skills when applicable: ${configured_skill_mentions}" >> "$GITHUB_ENV"
          else
            echo "BACKUP_CLAUDE_SKILL_REMINDER=" >> "$GITHUB_ENV"
          fi

      - name: Run Codex Review with backup
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' }}
        id: codex-review-backup
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ steps.ai-config.outputs.backup_token }}
          CODEX_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          CODEX_EFFORT: ${{ steps.ai-config.outputs.backup_effort_level }}
          CODEX_SKILLS_B64: ${{ steps.ai-config.outputs.backup_skills_b64 }}
          REVIEW_PROMPT: ${{ env.BACKUP_REVIEW_PROMPT }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v codex >/dev/null 2>&1; then
            echo "::error::Codex CLI is not installed in this runner image."
            exit 1
          fi

          export CODEX_HOME="${RUNNER_TEMP}/codex-backup"
          skills_home="${RUNNER_TEMP}/codex-backup-home"
          git_global_config="${HOME}/.gitconfig"
          install -d -m 0700 "$CODEX_HOME"
          install -d -m 0700 "$skills_home"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 0600 "$CODEX_HOME/auth.json"

          configured_skill_mentions=''
          if ! skills_json="$(printf '%s' "${CODEX_SKILLS_B64:-W10=}" | base64 --decode 2>/dev/null)" || ! jq -e 'type == "array"' <<< "$skills_json" >/dev/null; then
            echo "::warning::Ignoring malformed Codex skills configuration."
            skills_json='[]'
          fi
          while IFS= read -r encoded_skill; do
            skill_json="$(printf '%s' "$encoded_skill" | base64 --decode)"
            if ! skill_name="$(jq -er '.name | select(test("^[a-z0-9][a-z0-9-]{0,63}$"))' <<< "$skill_json")" \
              || ! skill_description="$(jq -er '.description | select(type == "string" and length > 0)' <<< "$skill_json")" \
              || ! skill_instructions="$(jq -er '.instructions | select(type == "string" and length > 0)' <<< "$skill_json")"; then
              echo "::warning::Skipping malformed Codex skill."
              continue
            fi
            skill_directory="$skills_home/.agents/skills/$skill_name"
            install -d -m 0700 "$skill_directory"
            {
              echo '---'
              printf 'name: %s\n' "$skill_name"
              printf 'description: %s\n' "$(jq -rn --arg value "$skill_description" '$value | @json')"
              echo '---'
              echo
              printf '%s\n' "$skill_instructions"
            } > "$skill_directory/SKILL.md"
            chmod 0600 "$skill_directory/SKILL.md"
            printf -v skill_mention '$%s' "$skill_name"
            [[ -z "$configured_skill_mentions" ]] || configured_skill_mentions+=', '
            configured_skill_mentions+="$skill_mention"
          done < <(jq -r '.[] | @base64' <<< "$skills_json")

          prompt_file="${RUNNER_TEMP}/codex-review-backup-prompt.txt"
          result_file="${RUNNER_TEMP}/codex-review-backup-result.md"
          events_file="${RUNNER_TEMP}/codex-review-backup-events.jsonl"
          error_file="${RUNNER_TEMP}/codex-review-backup-error.log"
          {
            printf 'REPO: %s\n' "${{ github.repository }}"
            printf 'PR NUMBER: %s\n' "${{ github.event.pull_request.number }}"
            printf 'REVIEW CONTEXT DIR: %s\n\n' "${{ steps.review-context.outputs.path }}"
            printf 'The primary review backend failed. Continue the automated review with this backup Codex account.\n\n'
            printf '%s\n' 'Your final response MUST start with REVIEW_STATUS: complete or REVIEW_STATUS: blocked. Use complete only after inspecting the repository and prepared pull request context.'
            printf '%s\n' "$REVIEW_PROMPT"
          } > "$prompt_file"
          [[ -z "$configured_skill_mentions" ]] || printf '\nUse these configured skills when applicable: %s\n' "$configured_skill_mentions" >> "$prompt_file"

          codex_args=(exec --ephemeral --ignore-user-config --ignore-rules --enable use_legacy_landlock --sandbox read-only --add-dir "${{ steps.review-context.outputs.path }}" -c 'approval_policy="never"' --json -o "$result_file")
          [[ -n "$CODEX_MODEL" ]] && codex_args+=(-m "$CODEX_MODEL")
          [[ -n "$CODEX_EFFORT" ]] && codex_args+=(-c "model_reasoning_effort=\"${CODEX_EFFORT}\"")

          if [[ "${{ github.event.pull_request.head.repo.id }}" == "${{ github.event.pull_request.base.repo.id }}" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            printf '\nReview the changes in the current checkout against base commit %s.\n' "${{ github.event.pull_request.base.sha }}" >> "$prompt_file"
          else
            context_dir="${RUNNER_TEMP}/codex-review-context"
            if [[ ! -s "$context_dir/pr.diff" ]]; then
              install -d -m 0700 "$context_dir"
              gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json title,body,author,baseRefName,headRefName,files > "$context_dir/pr.json"
              gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > "$context_dir/pr.diff"
              gh pr checks "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > "$context_dir/checks.txt" || true
            fi
            printf '\nReview the fork PR metadata, diff, and checks in %s. Do not execute code from the diff.\n' "$context_dir" >> "$prompt_file"
          fi
          codex_args+=(-)

          show_codex_backup_failure() {
            if [[ -s "$error_file" ]]; then
              tail -c 4000 "$error_file" || true
            fi

            structured_error="$(jq -r 'select(.type == "error" or .type == "turn.failed") | .message // (.error | if type == "object" then .message else . end) // empty' "$events_file" 2>/dev/null | tail -c 4000)"
            if [[ -n "$structured_error" ]]; then
              printf '%s\n' "$structured_error"
            elif [[ ! -s "$error_file" ]]; then
              echo 'Backup Codex exited without a structured error message.'
            fi
          }

          if ! GIT_CONFIG_GLOBAL="$git_global_config" HOME="$skills_home" timeout 900 codex "${codex_args[@]}" < "$prompt_file" > "$events_file" 2> "$error_file"; then
            echo "::error::Backup Codex review failed."
            show_codex_backup_failure
            exit 1
          fi

          if [[ ! -s "$result_file" ]] || ! jq -e 'select(.type == "turn.completed")' "$events_file" >/dev/null; then
            echo "::error::Backup Codex did not produce a completed review result."
            show_codex_backup_failure
            exit 1
          fi

          if ! head -n 1 "$result_file" | grep -Fxq 'REVIEW_STATUS: complete'; then
            printf 'failed\ncodex\n%s\n' "${{ steps.ai-config.outputs.backup_display_name }}" > "${RUNNER_TEMP}/review-health"
            echo "::error::Backup Codex completed without a semantically verified review."
            exit 1
          fi

          tail -n +2 "$result_file" | head -c 60000 > "${result_file}.comment"
          jq -Rs '{body: ("<!-- managed-review:complete -->\n**Codex backup finished the automated review** — [View job](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n" + .)}' "${result_file}.comment" | curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @- >/dev/null
          printf 'passed\ncodex\n%s\n' "${{ steps.ai-config.outputs.backup_display_name }}" > "${RUNNER_TEMP}/review-health"

      - name: Run Claude Code Review with backup
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' }}
        id: claude-review-backup-oauth
        continue-on-error: true
        uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai-config.outputs.backup_base_url }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.ai-config.outputs.backup_token }}
          ANTHROPIC_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai-config.outputs.backup_default_opus_model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai-config.outputs.backup_default_sonnet_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai-config.outputs.backup_default_haiku_model }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.ai-config.outputs.backup_subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.ai-config.outputs.backup_effort_level }}
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ steps.ai-config.outputs.backup_token }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ steps.ai-config.outputs.backup_base_url }}",
                "ANTHROPIC_MODEL": "${{ steps.ai-config.outputs.backup_model }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ steps.ai-config.outputs.backup_default_opus_model }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ steps.ai-config.outputs.backup_default_sonnet_model }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ steps.ai-config.outputs.backup_default_haiku_model }}",
                "CLAUDE_CODE_SUBAGENT_MODEL": "${{ steps.ai-config.outputs.backup_subagent_model }}"
              }
            }
          claude_args: ${{ steps.ai-config.outputs.backup_claude_args }} ${{ steps.laravel-boost.outputs.claude_args }} --add-dir ${{ steps.review-context.outputs.path }} ${{ steps.claude-review-backup.outputs.resume_args }}
          plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW CONTEXT DIR: ${{ steps.review-context.outputs.path }}

            The primary Claude Code Review backend and resume retry failed. Continue the review using the configured backup AI backend.

            ${{ env.BACKUP_CLAUDE_SKILL_REMINDER }}

            ${{ env.BACKUP_REVIEW_PROMPT }}

      - name: Validate Claude Code Review backup result
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' }}
        id: claude-review-backup-oauth-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-backup-oauth.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-backup-oauth.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code backup concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code backup did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false) and (.[-1].result | startswith("REVIEW_STATUS: complete"))' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code backup returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
          exit 1

      - name: Run Claude Code Review with backup custom backend
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && (steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') }}
        id: claude-review-backup-custom
        continue-on-error: true
        uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970
        env:
          ANTHROPIC_BASE_URL: ${{ steps.ai-config.outputs.backup_base_url }}
          ANTHROPIC_API_KEY: ${{ steps.ai-config.outputs.backup_token }}
          ANTHROPIC_MODEL: ${{ steps.ai-config.outputs.backup_model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.ai-config.outputs.backup_default_opus_model }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai-config.outputs.backup_default_sonnet_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai-config.outputs.backup_default_haiku_model }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.ai-config.outputs.backup_subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.ai-config.outputs.backup_effort_level }}
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ steps.ai-config.outputs.backup_token }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ steps.ai-config.outputs.backup_base_url }}",
                "ANTHROPIC_MODEL": "${{ steps.ai-config.outputs.backup_model }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ steps.ai-config.outputs.backup_default_opus_model }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ steps.ai-config.outputs.backup_default_sonnet_model }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ steps.ai-config.outputs.backup_default_haiku_model }}",
                "CLAUDE_CODE_SUBAGENT_MODEL": "${{ steps.ai-config.outputs.backup_subagent_model }}"
              }
            }
          claude_args: ${{ steps.ai-config.outputs.backup_claude_args }} ${{ steps.laravel-boost.outputs.claude_args }} --add-dir ${{ steps.review-context.outputs.path }} ${{ steps.claude-review-backup.outputs.resume_args }}
          plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW CONTEXT DIR: ${{ steps.review-context.outputs.path }}

            The primary Claude Code Review backend and resume retry failed. Continue the review using the configured backup AI backend.

            ${{ env.BACKUP_CLAUDE_SKILL_REMINDER }}

            ${{ env.BACKUP_REVIEW_PROMPT }}

      - name: Validate Claude Code Review backup custom backend result
        if: ${{ steps.claude-review-backup.outputs.available == 'true' && (steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') }}
        id: claude-review-backup-custom-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review-backup-custom.outputs.conclusion }}"
          execution_file="${{ steps.claude-review-backup-custom.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Claude Code backup custom backend concluded with ${conclusion:-no conclusion}."
            exit 1
          fi

          if [[ -z "$execution_file" || ! -f "$execution_file" ]]; then
            echo "::error::Claude Code backup custom backend did not produce an execution output file."
            exit 1
          fi

          if jq -e '.[-1].type == "result" and ((.[-1].is_error // false) == false) and (.[-1].result | startswith("REVIEW_STATUS: complete"))' "$execution_file" >/dev/null; then
            exit 0
          fi

          echo "::error::Claude Code backup custom backend returned an error result even though the action concluded successfully."
          jq -c '.[-1]' "$execution_file" || true
          exit 1

      - name: Report reviewer health
        if: ${{ always() && steps.review-workflow.outputs.changed != 'true' && steps.review-context.outcome != 'skipped' }}
        id: report-reviewer-health
        continue-on-error: true
        env:
          RUNNER_MANAGER_URL: "https://ci.marin.sh"
        shell: bash
        run: |
          set -euo pipefail

          health_file="${RUNNER_TEMP}/review-health"
          if [[ -s "$health_file" ]]; then
            status="$(sed -n '1p' "$health_file")"
            backend="$(sed -n '2p' "$health_file")"
            account="$(sed -n '3p' "$health_file")"
          elif [[ "${{ steps.claude-review-result.outcome }}" == "success" \
            || "${{ steps.claude-review-retry-result.outcome }}" == "success" \
            || "${{ steps.claude-review-custom-result.outcome }}" == "success" \
            || "${{ steps.claude-review-custom-retry-result.outcome }}" == "success" \
            || "${{ steps.claude-review-backup-oauth-result.outcome }}" == "success" \
            || "${{ steps.claude-review-backup-custom-result.outcome }}" == "success" ]]; then
            status=passed
            backend=claude
            account="${{ steps.ai-config.outputs.display_name }}"
          else
            status=failed
            backend="${{ steps.ai-config.outputs.backend }}"
            account="${{ steps.ai-config.outputs.display_name }}"
          fi

          if [[ "$status" == "passed" ]]; then
            message="Reviewer inspected the prepared context and completed successfully."
          else
            message="Reviewer did not produce a semantically verified result. Preflight: ${{ steps.reviewer-preflight.outcome }}; backend config: ${{ steps.ai-config.outcome }}; Codex: ${{ steps.codex-review.outcome }}."
          fi

          oidc_response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RUNNER_MANAGER_URL%/}")"
          oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          jq -n \
            --arg status "$status" \
            --arg backend "$backend" \
            --arg account "$account" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg message "$message" \
            '{status: $status, backend: $backend, account: $account, run_url: $run_url, message: $message}' \
            | curl -fsSL -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "${RUNNER_MANAGER_URL%/}/api/broker/reviewer/health" >/dev/null

      - name: Persist refreshed Codex authentication and release accounts
        if: ${{ always() && steps.ai-config.outcome == 'success' && (steps.ai-config.outputs.codex_account_uuid != '' || steps.ai-config.outputs.backup_codex_account_uuid != '') }}
        continue-on-error: true
        env:
          RUNNER_MANAGER_URL: "https://ci.marin.sh"
          PRIMARY_ACCOUNT_UUID: ${{ steps.ai-config.outputs.codex_account_uuid }}
          PRIMARY_LEASE_TOKEN: ${{ steps.ai-config.outputs.codex_lease_token }}
          PRIMARY_AUTH_JSON: ${{ steps.ai-config.outputs.token_type == 'CODEX_AUTH_JSON' && steps.ai-config.outputs.token || '' }}
          BACKUP_ACCOUNT_UUID: ${{ steps.ai-config.outputs.backup_codex_account_uuid }}
          BACKUP_LEASE_TOKEN: ${{ steps.ai-config.outputs.backup_codex_lease_token }}
          BACKUP_AUTH_JSON: ${{ steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' && steps.ai-config.outputs.backup_token || '' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_MANAGER_URL:?RUNNER_MANAGER_URL is required}"

          oidc_response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RUNNER_MANAGER_URL%/}")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$oidc_response")"

          complete_codex_lease() {
            local account_uuid="$1"
            local lease_token="$2"
            local original_auth="$3"
            local home_path="$4"

            [[ -z "$account_uuid" || -z "$lease_token" ]] && return 0
            local auth_json="$original_auth"
            [[ -s "$home_path/auth.json" ]] && auth_json="$(cat "$home_path/auth.json")"
            jq -n --arg lease_token "$lease_token" --arg auth_json "$auth_json" '{lease_token: $lease_token, auth_json: $auth_json}' > "${RUNNER_TEMP}/codex-lease-${account_uuid}.json"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "@${RUNNER_TEMP}/codex-lease-${account_uuid}.json" \
              "${RUNNER_MANAGER_URL%/}/api/broker/codex/accounts/${account_uuid}/complete" >/dev/null
          }

          completion_failed=0
          complete_codex_lease "$PRIMARY_ACCOUNT_UUID" "$PRIMARY_LEASE_TOKEN" "$PRIMARY_AUTH_JSON" "${RUNNER_TEMP}/codex-primary" || completion_failed=1
          complete_codex_lease "$BACKUP_ACCOUNT_UUID" "$BACKUP_LEASE_TOKEN" "$BACKUP_AUTH_JSON" "${RUNNER_TEMP}/codex-backup" || completion_failed=1
          exit "$completion_failed"

      - name: Clean up AI review files
        if: ${{ always() }}
        shell: bash
        run: |
          for skill_manifest in \
            "${RUNNER_TEMP}/claude-primary-skill-manifest" \
            "${RUNNER_TEMP}/claude-backup-skill-manifest"; do
            [[ -f "$skill_manifest" ]] || continue
            while IFS= read -r skill_name; do
              [[ "$skill_name" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || continue
              rm -rf "${HOME}/.claude/skills/${skill_name}"
            done < "$skill_manifest"
          done

          rm -rf \
            "${RUNNER_TEMP}/codex-primary" \
            "${RUNNER_TEMP}/codex-primary-home" \
            "${RUNNER_TEMP}/codex-backup" \
            "${RUNNER_TEMP}/codex-backup-home" \
            "${RUNNER_TEMP}/codex-review-context" \
            "${RUNNER_TEMP}/pr-review-context" \
            "${RUNNER_TEMP}/review-tools" \
            "${RUNNER_TEMP}/claude-primary-skill-manifest" \
            "${RUNNER_TEMP}/claude-backup-skill-manifest"
          find "${RUNNER_TEMP}" -maxdepth 1 -type f -name 'codex-lease-*.json' -delete

      - name: Warn when AI review is unavailable
        if: ${{ steps.review-tools.outcome == 'failure' || steps.review-workflow.outcome == 'failure' || steps.review-context.outcome == 'failure' || steps.reviewer-preflight.outcome == 'failure' || steps.ai-config.outcome == 'failure' || steps.claude-review-backup.outputs.available == 'false' || (steps.ai-config.outputs.backup_token_type == 'CODEX_AUTH_JSON' && steps.codex-review-backup.outcome == 'failure') || (steps.ai-config.outputs.backup_token_type == 'CLAUDE_CODE_OAUTH_TOKEN' && steps.claude-review-backup-oauth-result.outcome == 'failure') || ((steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_API_KEY' || steps.ai-config.outputs.backup_token_type == 'ANTHROPIC_AUTH_TOKEN') && steps.claude-review-backup-custom-result.outcome == 'failure') }}
        shell: bash
        run: |
          echo "::error::AI review is currently unavailable because a required workflow prerequisite, AI service, or authentication configuration is unavailable."
          {
            echo "## AI review unavailable"
            echo
            echo "The configured AI review failed because its authenticated pull request context, workflow safety check, AI service, broker, or authentication configuration is currently unavailable to this repository."
            echo "Please restore the missing workflow prerequisite or AI backend access before relying on this workflow for automated review."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
