          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.ai-config.outputs.default_sonnet_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.ai-config.outputs.default_haiku_model }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.ai-config.outputs.subagent_model }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.ai-config.outputs.effort_level }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${HOME}/.npm-global/bin:${PATH}"
          if [[ "$AI_TOKEN_TYPE" == "ANTHROPIC_AUTH_TOKEN" ]]; then
            export ANTHROPIC_AUTH_TOKEN="$AI_TOKEN"
            unset ANTHROPIC_API_KEY
          else
            export ANTHROPIC_API_KEY="$AI_TOKEN"
            unset ANTHROPIC_AUTH_TOKEN
          fi

          if ! command -v claude >/dev/null 2>&1; then
            curl -fsSL https://claude.ai/install.sh | bash
            export PATH="${HOME}/.local/bin:${HOME}/.npm-global/bin:${PATH}"
          fi

          prompt_file="$(mktemp)"
          {
            printf '%s\n' 'REPO: ${{ github.repository }}'
            printf '%s\n' 'PR NUMBER: ${{ github.event.pull_request.number }}'
