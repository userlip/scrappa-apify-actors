          timeout 600 claude -p "$(cat "$prompt_file")" \
            --output-format stream-json \
            --verbose \
            --permission-mode acceptEdits \
            --add-dir "${REVIEW_CONTEXT_DIR}" \
            --allowedTools "Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Grep,Glob,WebFetch,Skill,mcp__laravel-boost__*" \
            --model "${ANTHROPIC_MODEL}" > "$output_jsonl" 2> "$error_log"
