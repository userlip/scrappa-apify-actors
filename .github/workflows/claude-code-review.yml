            --verbose \
            --permission-mode acceptEdits \
            --allowedTools "Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Grep,Glob,WebFetch,mcp__laravel-boost__*" \
