            ${{ env.REVIEW_PROMPT }}

      - name: Validate Claude Code Review retry result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && steps.ai-config.outputs.token_type == 'CLAUDE_CODE_OAUTH_TOKEN' && steps.claude-review-result.outcome == 'failure' && steps.claude-review.outputs.session_id != '' }}
