              echo '```text'
              tail -c 4000 "$error_log"
              echo
              echo '```'
            fi
            if [[ -s "$output_jsonl" ]]; then
              echo "stdout:"
              echo '```text'
              tail -c 4000 "$output_jsonl"
              echo
              echo '```'
            fi
          } > "$body_file"
          jq -n --rawfile body "$body_file" '{ body: $body }' \
