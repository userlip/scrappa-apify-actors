            echo
            echo "Exit status: $status"
            echo "Backend: ${AI_TOKEN_TYPE}, model: ${ANTHROPIC_MODEL:-default}, base URL: ${ANTHROPIC_BASE_URL:-default}"
            echo "Token fingerprint: sha256:${AI_TOKEN_FINGERPRINT}, length: ${AI_TOKEN_LENGTH}"
            echo
            if [[ -s "$error_log" ]]; then
              echo "stderr:"
              echo '```text'
              tail -c 4000 "$error_log"
              echo
              echo '```'
            fi
            if [[ -s "$output_jsonl" ]]; then
              echo "stdout:"
              echo '```text'
