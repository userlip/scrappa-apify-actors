          if [[ "$status" -eq 0 ]] && jq -e '.[-1].type == "result" and .[-1].subtype == "success" and ((.[-1].is_error // false) == false)' "$execution_file" >/dev/null; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          body_file="$(mktemp)"
