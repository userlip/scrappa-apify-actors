          plugins: superpowers@superpowers-marketplace
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ env.REVIEW_PROMPT }}

      - name: Validate Claude Code Review result
        if: ${{ steps.review-workflow.outputs.changed != 'true' && steps.ai-config.outcome == 'success' && steps.ai-config.outputs.token_type == 'CLAUDE_CODE_OAUTH_TOKEN' }}
        id: claude-review-result
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          conclusion="${{ steps.claude-review.outputs.conclusion }}"
          execution_file="${{ steps.claude-review.outputs.execution_file }}"
          if [[ "$conclusion" != "success" ]]; then
