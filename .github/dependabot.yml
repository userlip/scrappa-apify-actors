# Dependabot configuration - security updates only
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust crates of all Actors - security updates only, grouped into one PR
  - package-ecosystem: "cargo"
    directories:
      - "/actors/*"
      - "/templates/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # 0 disables version updates; security updates still open
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "security(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # npm dependencies - security updates only
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # 0 disables version updates; security updates still open
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "security(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions - security updates only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "security(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

